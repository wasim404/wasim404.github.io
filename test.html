<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多维度进度条</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* 按钮组样式 */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            background-color: #e0e0e0;
            color: #555;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            background-color: #d0d0d0;
        }

        .btn.active {
            background-color: #4a90e2;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        /* 进度条容器 */
        .progress-container {
            position: relative;
            width: 100%;
            height: 12px;
            background-color: #f0f0f0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        /* 实际进度填充 */
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a90e2, #5ca9f5);
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* 进度百分比显示 */
        .progress-text {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        /* 箭头指示器 */
        .arrow-indicator {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateX(-50%) translateY(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid #e74c3c;
            opacity: 0;
            transition: left 0.5s ease, opacity 0.3s ease;
        }

        /* 显示箭头时 */
        .arrow-indicator.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>多维度时间进度条</h1>

        <!-- 按钮组 -->
        <div class="button-group">
            <button class="btn" data-type="year">年进度</button>
            <button class="btn" data-type="month">月进度</button>
            <button class="btn" data-type="week">周进度</button>
            <button class="btn" data-type="day">日进度</button>
        </div>

        <!-- 百分比显示 -->
        <div class="progress-text">0%</div>

        <!-- 进度条容器 -->
        <div class="progress-container">
            <div class="progress-bar"></div>
            <div class="arrow-indicator"></div>
        </div>
    </div>
    <script>
        // 获取DOM元素
        const buttons = document.querySelectorAll('.btn');
        const progressBar = document.querySelector('.progress-bar');
        const progressText = document.querySelector('.progress-text');
        const arrowIndicator = document.querySelector('.arrow-indicator');
    
        // 当前选中的类型
        let currentType = 'day';
    
        // 为所有按钮添加点击事件
        buttons.forEach(button => {
            button.addEventListener('click', function() {
                // 移除所有按钮的 active 类
                buttons.forEach(btn => btn.classList.remove('active'));
                // 为当前点击的按钮添加 active 类
                this.classList.add('active');
                // 更新当前类型
                currentType = this.dataset.type;
                // 更新进度显示
                updateProgress();
            });
        });
    
        // 计算并更新进度的函数
        function updateProgress() {
            const now = new Date();
            let progress = 0;
    
            // 所有时间计算中可能用到的变量
            let start, end, totalMs, elapsedMs;
            const msInDay = 24 * 60 * 60 * 1000; // 一天的毫秒数
    
            switch(currentType) {
                case 'year':
                    start = new Date(now.getFullYear(), 0, 1);
                    end = new Date(now.getFullYear() + 1, 0, 1);
                    totalMs = end - start;
                    elapsedMs = now - start;
                    progress = (elapsedMs / totalMs) * 100;
                    break;
    
                case 'month':
                    start = new Date(now.getFullYear(), now.getMonth(), 1);
                    end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                    totalMs = end - start;
                    elapsedMs = now - start;
                    progress = (elapsedMs / totalMs) * 100;
                    break;
    
                case 'week':
                    // 周从周一开始
                    const dayOfWeek = now.getDay(); // 0=周日, 1=周一, ..., 6=周六
                    const dayIndex = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // 转换为周一=0
                    progress = (dayIndex / 7) * 100; // 完整天数占比
    
                    // 今天已过去的时间（毫秒）
                    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    elapsedMs = now - startOfDay;
                    // 加上今天时间在一周中的占比
                    progress += (elapsedMs / msInDay) / 7 * 100;
                    break;
    
                case 'day':
                default:
                    start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
                    totalMs = end - start;
                    elapsedMs = now - start;
                    progress = (elapsedMs / totalMs) * 100;
                    break;
            }
    
            // 限制进度在 0-100%
            progress = Math.max(0, Math.min(100, progress));
    
            // 更新UI
            progressBar.style.width = `${progress.toFixed(1)}%`;
            progressText.textContent = `${progress.toFixed(1)}%`;
    
            // 更新箭头位置
            const containerWidth = document.querySelector('.progress-container').offsetWidth;
            const arrowPosition = (progress / 100) * containerWidth;
            arrowIndicator.style.left = `${arrowPosition}px`;
            arrowIndicator.classList.add('show');
        }
    
        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            const dayButton = document.querySelector('button[data-type="day"]');
            dayButton.classList.add('active');
            updateProgress();
    
            // 实时更新日/周进度
            const interval = setInterval(() => {
                if (currentType === 'day' || currentType === 'week') {
                    updateProgress();
                }
            }, 1000);
    
            // 清理定时器
            window.addEventListener('beforeunload', () => {
                clearInterval(interval);
            });
        });
    </script>
</body>
</html>
