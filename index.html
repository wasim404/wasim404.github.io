<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <ul class="navbar">
            <li><a href="index.html">主页</a></li>
            <li><a href="plan.html">规划</a></li>

        </ul>
    </nav>

    <div class="container">
        <!-- 按钮组 -->
        <div class="button-group">
            <button class="btn" data-type="year">年进度</button>
            <button class="btn" data-type="month">月进度</button>
            <button class="btn" data-type="week">周进度</button>
            <button class="btn" data-type="day">日进度</button>
        </div>

        <!-- 百分比显示 -->
        <div class="progress-text">0%</div>

    <div class="function_box">
        <div class="function">
            <div class="emoji">🗡️</div>

            <div class="emoji">📒</div>
            <a href="today.html"><h3>今日安排</h3></a>

        </div>
        
        <div class="function">
            <div class="emoji">📁</div>
            <a href="collection.html"><h3>收藏夹</h3></a>
            <p>我们会一直在这等你</p>
        </div>

        <div class="function">
            <div class="emoji">🔖</div>
            <a href="note.html"><h3>随手签</h3></a>

    <script src="js/progress.js"></script>
